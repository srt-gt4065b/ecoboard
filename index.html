<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Collab E-Board</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        body { background-color: #111827; margin: 0; overflow: hidden; touch-action: none; }
        canvas { touch-action: none; cursor: crosshair; }
        .glass-panel { background: rgba(31, 41, 55, 0.85); backdrop-filter: blur(10px); }
        .text-input-overlay {
            position: absolute;
            background: transparent;
            border: 1px dashed #10b981;
            color: white;
            outline: none;
            padding: 2px;
            font-family: sans-serif;
            z-index: 50;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, addDoc, deleteDoc, writeBatch, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useRef, useCallback } = React;

        // --- Firebase Configuration (User Provided) ---
        const firebaseConfig = {
            apiKey: "AIzaSyDK2VURk2eqaRy52yi2sPZuwYVb2ymmR3I",
            authDomain: "eboard-95055.firebaseapp.com",
            databaseURL: "https://eboard-95055-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "eboard-95055",
            storageBucket: "eboard-95055.firebasestorage.app",
            messagingSenderId: "927523134440",
            appId: "1:927523134440:web:4a546e6c565368e283e25d",
            measurementId: "G-BCPK0YX0E3"
        };

        // 고유한 앱 ID 설정 (문서 경로용)
        const appId = firebaseConfig.projectId;
        
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- Icons ---
        const Icons = {
            Pencil: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>,
            Text: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M12 6v14m-5 0h10" /></svg>,
            Trash: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
            Users: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
            Send: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>,
            ChevronLeft: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7" /></svg>,
            ChevronRight: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" /></svg>,
            Undo: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" /></svg>
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [nickname, setNickname] = useState('');
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentPage, setCurrentPage] = useState(1);
            const [data, setData] = useState({ strokes: [], texts: [], messages: [], users: [] });
            const [ui, setUi] = useState({ 
                color: '#10b981', 
                width: 4, 
                showChat: true, 
                msg: '', 
                tool: 'pencil'
            });
            const [textInput, setTextInput] = useState({ active: false, x: 0, y: 0, rawX: 0, rawY: 0, value: '' });

            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const drawing = useRef({ isDrawing: false, points: [] });
            const textRef = useRef(null);

            // 1. Auth Initialization
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        // 시스템에서 제공하는 토큰이 있으면 사용, 없으면 익명 로그인
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.error("Auth failed:", err);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    if (u) {
                        setUser(u);
                        const savedName = localStorage.getItem(`eboard_nick_${appId}`);
                        if (savedName) {
                            setNickname(savedName);
                            setIsLoggedIn(true);
                        }
                    }
                });
                return () => unsubscribe();
            }, []);

            // 2. Data Sync
            useEffect(() => {
                if (!user) return;
                const base = ['artifacts', appId, 'public', 'data'];
                
                const unsubStrokes = onSnapshot(
                    query(collection(db, ...base, 'strokes'), orderBy('timestamp', 'asc')),
                    s => setData(p => ({ ...p, strokes: s.docs.map(d => ({ id: d.id, ...d.data() })) })),
                    e => console.error("Strokes error:", e)
                );

                const unsubTexts = onSnapshot(
                    query(collection(db, ...base, 'texts'), orderBy('timestamp', 'asc')),
                    s => setData(p => ({ ...p, texts: s.docs.map(d => ({ id: d.id, ...d.data() })) })),
                    e => console.error("Texts error:", e)
                );

                const unsubMessages = onSnapshot(
                    query(collection(db, ...base, 'messages'), orderBy('timestamp', 'asc')),
                    s => setData(p => ({ ...p, messages: s.docs.map(d => ({ id: d.id, ...d.data() })) })),
                    e => console.error("Messages error:", e)
                );

                const unsubUsers = onSnapshot(
                    collection(db, ...base, 'users'),
                    s => setData(p => ({ ...p, users: s.docs.map(d => ({ id: d.id, ...d.data() })) })),
                    e => console.error("Users error:", e)
                );

                return () => { unsubStrokes(); unsubTexts(); unsubMessages(); unsubUsers(); };
            }, [user]);

            // 3. Canvas Redraw
            const redraw = useCallback(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const dpr = window.devicePixelRatio || 1;
                
                ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
                const w = canvas.width / dpr;
                const h = canvas.height / dpr;
                
                // Draw Strokes
                data.strokes.filter(s => (s.page || 1) === currentPage).forEach(s => {
                    if (!s.points || s.points.length < 2) return;
                    ctx.beginPath();
                    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                    ctx.strokeStyle = s.color; ctx.lineWidth = s.width;
                    ctx.moveTo(s.points[0].x * w, s.points[0].y * h);
                    s.points.slice(1).forEach(p => ctx.lineTo(p.x * w, p.y * h));
                    ctx.stroke();
                });

                // Draw Texts
                data.texts.filter(t => (t.page || 1) === currentPage).forEach(t => {
                    ctx.fillStyle = t.color;
                    ctx.font = `${Math.max(14, t.fontSize * 4)}px sans-serif`;
                    ctx.fillText(t.text, t.x * w, t.y * h);
                });
            }, [data.strokes, data.texts, currentPage]);

            useEffect(() => { redraw(); }, [redraw]);

            // 4. Resize Handling
            useEffect(() => {
                const handleResize = () => {
                    if (!containerRef.current || !canvasRef.current) return;
                    const { width, height } = containerRef.current.getBoundingClientRect();
                    const dpr = window.devicePixelRatio || 1;
                    canvasRef.current.width = width * dpr;
                    canvasRef.current.height = height * dpr;
                    canvasRef.current.getContext('2d').scale(dpr, dpr);
                    canvasRef.current.style.width = `${width}px`;
                    canvasRef.current.style.height = `${height}px`;
                    redraw();
                };
                window.addEventListener('resize', handleResize);
                handleResize();
                return () => window.removeEventListener('resize', handleResize);
            }, [redraw]);

            // 5. Interaction Handlers
            const getPos = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) / rect.width,
                    y: (clientY - rect.top) / rect.height,
                    rawX: clientX - rect.left,
                    rawY: clientY - rect.top
                };
            };

            const drawStart = (e) => {
                if (!isLoggedIn) return;
                const pos = getPos(e);

                if (ui.tool === 'text') {
                    setTextInput({ active: true, x: pos.x, y: pos.y, rawX: pos.rawX, rawY: pos.rawY, value: '' });
                    return;
                }

                drawing.current.isDrawing = true;
                drawing.current.points = [{ x: pos.x, y: pos.y }];
            };

            const drawMove = (e) => {
                if (!drawing.current.isDrawing) return;
                const pos = getPos(e);
                drawing.current.points.push({ x: pos.x, y: pos.y });
                
                const ctx = canvasRef.current.getContext('2d');
                const last = drawing.current.points[drawing.current.points.length - 2];
                const dpr = window.devicePixelRatio || 1;
                const w = canvasRef.current.width / dpr;
                const h = canvasRef.current.height / dpr;

                ctx.beginPath();
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.strokeStyle = ui.color; ctx.lineWidth = ui.width;
                ctx.moveTo(last.x * w, last.y * h);
                ctx.lineTo(pos.x * w, pos.y * h);
                ctx.stroke();
            };

            const drawEnd = async () => {
                if (!drawing.current.isDrawing) return;
                drawing.current.isDrawing = false;
                if (drawing.current.points.length < 2) return;

                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'strokes'), {
                    points: drawing.current.points,
                    color: ui.color,
                    width: ui.width,
                    page: currentPage,
                    userId: user.uid,
                    userName: nickname,
                    timestamp: serverTimestamp()
                });
            };

            const submitText = async () => {
                if (!textInput.value.trim()) {
                    setTextInput(p => ({ ...p, active: false }));
                    return;
                }
                const newText = {
                    text: textInput.value,
                    x: textInput.x,
                    y: textInput.y,
                    color: ui.color,
                    fontSize: ui.width * 2,
                    page: currentPage,
                    userId: user.uid,
                    userName: nickname,
                    timestamp: serverTimestamp()
                };
                setTextInput({ active: false, x: 0, y: 0, rawX: 0, rawY: 0, value: '' });
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'texts'), newText);
            };

            // 6. Action Handlers
            const handleJoin = async (e) => {
                e.preventDefault();
                if (!nickname.trim()) return;
                setIsLoggedIn(true);
                localStorage.setItem(`eboard_nick_${appId}`, nickname);
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', user.uid), {
                    name: nickname, uid: user.uid, lastSeen: serverTimestamp()
                });
            };

            const sendMessage = async (e) => {
                e.preventDefault();
                if (!ui.msg.trim()) return;
                const m = ui.msg;
                setUi(p => ({ ...p, msg: '' }));
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), {
                    text: m, userId: user.uid, userName: nickname, timestamp: serverTimestamp()
                });
            };

            const clearPage = async () => {
                if (!confirm(`페이지 ${currentPage}의 모든 드로잉과 텍스트를 지울까요?`)) return;
                const batch = writeBatch(db);
                data.strokes.filter(s => (s.page || 1) === currentPage)
                    .forEach(s => batch.delete(doc(db, 'artifacts', appId, 'public', 'data', 'strokes', s.id)));
                data.texts.filter(t => (t.page || 1) === currentPage)
                    .forEach(t => batch.delete(doc(db, 'artifacts', appId, 'public', 'data', 'texts', t.id)));
                await batch.commit();
            };

            const undoLast = async () => {
                const myStrokes = data.strokes.filter(s => s.userId === user.uid && (s.page || 1) === currentPage);
                const myTexts = data.texts.filter(t => t.userId === user.uid && (t.page || 1) === currentPage);
                
                const lastStroke = myStrokes[myStrokes.length - 1];
                const lastText = myTexts[myTexts.length - 1];

                if (!lastStroke && !lastText) return;

                let target;
                if (!lastStroke) target = { id: lastText.id, col: 'texts' };
                else if (!lastText) target = { id: lastStroke.id, col: 'strokes' };
                else {
                    const sTime = lastStroke.timestamp?.toMillis() || 0;
                    const tTime = lastText.timestamp?.toMillis() || 0;
                    target = sTime > tTime ? { id: lastStroke.id, col: 'strokes' } : { id: lastText.id, col: 'texts' };
                }

                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', target.col, target.id));
            };

            if (!isLoggedIn) {
                return (
                    <div className="h-screen w-full flex items-center justify-center bg-gray-900 p-4">
                        <div className="max-w-md w-full bg-gray-800 p-8 rounded-3xl border border-gray-700 shadow-2xl">
                            <h1 className="text-3xl font-black text-white mb-2 text-center bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-400">E-BOARD COLLAB</h1>
                            <p className="text-gray-400 text-center mb-8 font-medium">실시간 공유 칠판에 참여하세요</p>
                            <form onSubmit={handleJoin} className="space-y-4">
                                <input 
                                    type="text" value={nickname} onChange={e => setNickname(e.target.value)}
                                    placeholder="닉네임을 입력하세요" 
                                    className="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-emerald-500 outline-none transition"
                                    autoFocus
                                />
                                <button type="submit" className="w-full bg-emerald-500 hover:bg-emerald-400 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-500/20">참여하기</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen w-full flex flex-col bg-gray-950 text-white overflow-hidden">
                    <header className="h-16 glass-panel border-b border-gray-800 flex items-center justify-between px-6 z-20">
                        <div className="flex items-center gap-4">
                            <span className="font-black tracking-tighter text-xl bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-400">BOARD.</span>
                            <div className="hidden md:flex items-center gap-2 text-xs text-gray-400 bg-gray-900 px-3 py-1 rounded-full border border-gray-800">
                                <Icons.Users />
                                <span>{data.users.length}명 참여중</span>
                            </div>
                        </div>
                        
                        <div className="flex items-center gap-2">
                            <button onClick={() => setCurrentPage(p => Math.max(1, p - 1))} className="p-2 hover:bg-gray-700 rounded-lg disabled:opacity-30" disabled={currentPage === 1}>
                                <Icons.ChevronLeft />
                            </button>
                            <span className="text-sm font-bold px-3">P. {currentPage}</span>
                            <button onClick={() => setCurrentPage(p => p + 1)} className="p-2 hover:bg-gray-700 rounded-lg">
                                <Icons.ChevronRight />
                            </button>
                            <div className="w-px h-6 bg-gray-800 mx-2" />
                            <button onClick={() => setUi(p => ({ ...p, showChat: !p.showChat }))} className={`p-2 rounded-lg transition ${ui.showChat ? 'bg-emerald-500/20 text-emerald-400' : 'hover:bg-gray-800'}`}>
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" /></svg>
                            </button>
                        </div>
                    </header>

                    <div className="flex-1 flex relative">
                        <div ref={containerRef} className="flex-1 relative overflow-hidden bg-[radial-gradient(#1f2937_1px,transparent_1px)] [background-size:24px_24px]">
                            <canvas 
                                ref={canvasRef} 
                                onMouseDown={drawStart} onMouseMove={drawMove} onMouseUp={drawEnd} onMouseLeave={drawEnd}
                                onTouchStart={drawStart} onTouchMove={drawMove} onTouchEnd={drawEnd}
                                className="block"
                            />

                            {/* Text Input Overlay */}
                            {textInput.active && (
                                <input
                                    ref={textRef}
                                    type="text"
                                    className="text-input-overlay"
                                    style={{ 
                                        left: textInput.rawX, 
                                        top: textInput.rawY - (ui.width * 2), 
                                        color: ui.color,
                                        fontSize: `${Math.max(14, ui.width * 4)}px`,
                                        minWidth: '100px'
                                    }}
                                    value={textInput.value}
                                    onChange={e => setTextInput(p => ({ ...p, value: e.target.value }))}
                                    onBlur={submitText}
                                    onKeyDown={e => e.key === 'Enter' && submitText()}
                                    autoFocus
                                />
                            )}
                            
                            {/* Floating Toolbar */}
                            <div className="absolute bottom-8 left-1/2 -translate-x-1/2 glass-panel border border-gray-700 px-6 py-3 rounded-3xl flex items-center gap-6 shadow-2xl">
                                <div className="flex gap-2 p-1 bg-gray-900/50 rounded-xl">
                                    <button 
                                        onClick={() => setUi(p => ({ ...p, tool: 'pencil' }))}
                                        className={`p-2 rounded-lg transition ${ui.tool === 'pencil' ? 'bg-emerald-500 text-white shadow-lg' : 'text-gray-400 hover:text-white'}`}
                                    >
                                        <Icons.Pencil />
                                    </button>
                                    <button 
                                        onClick={() => setUi(p => ({ ...p, tool: 'text' }))}
                                        className={`p-2 rounded-lg transition ${ui.tool === 'text' ? 'bg-emerald-500 text-white shadow-lg' : 'text-gray-400 hover:text-white'}`}
                                    >
                                        <Icons.Text />
                                    </button>
                                </div>
                                <div className="w-px h-6 bg-gray-700" />
                                <div className="flex gap-3">
                                    {['#10b981', '#ef4444', '#3b82f6', '#ffffff'].map(c => (
                                        <button 
                                            key={c} onClick={() => setUi(p => ({ ...p, color: c }))} 
                                            className={`w-7 h-7 rounded-full border-2 ${ui.color === c ? 'border-white scale-110 ring-4 ring-white/10' : 'border-transparent opacity-60'}`}
                                            style={{ backgroundColor: c }}
                                        />
                                    ))}
                                </div>
                                <div className="w-px h-6 bg-gray-700" />
                                <input 
                                    type="range" min="2" max="15" 
                                    value={ui.width} onChange={e => setUi(p => ({ ...p, width: parseInt(e.target.value) }))}
                                    className="w-20 h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-emerald-500"
                                />
                                <div className="w-px h-6 bg-gray-700" />
                                <div className="flex gap-2">
                                    <button onClick={undoLast} title="실행 취소" className="p-2 hover:bg-gray-700 rounded-xl transition text-gray-400 hover:text-white"><Icons.Undo /></button>
                                    <button onClick={clearPage} title="모두 지우기" className="p-2 hover:bg-red-500/20 rounded-xl transition text-gray-400 hover:text-red-400"><Icons.Trash /></button>
                                </div>
                            </div>
                        </div>

                        <div className={`transition-all duration-300 ${ui.showChat ? 'w-80 border-l border-gray-800' : 'w-0 overflow-hidden'} flex flex-col glass-panel z-10`}>
                            <div className="p-4 border-b border-gray-800 bg-gray-900/50">
                                <h3 className="font-bold flex items-center gap-2 text-emerald-400 text-sm uppercase tracking-widest">Live Chat</h3>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                {data.messages.map((m, i) => (
                                    <div key={m.id || i} className={`flex flex-col ${m.userId === user?.uid ? 'items-end' : 'items-start'}`}>
                                        <span className="text-[10px] text-gray-500 mb-1 px-1 font-mono uppercase">{m.userName}</span>
                                        <div className={`max-w-[90%] px-3 py-2 text-sm rounded-2xl ${
                                            m.userId === user?.uid ? 'bg-emerald-600 text-white rounded-tr-none' : 'bg-gray-800 text-gray-200 rounded-tl-none border border-gray-700'
                                        }`}>
                                            {m.text}
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <form onSubmit={sendMessage} className="p-4 bg-gray-900/80 border-t border-gray-800 flex gap-2">
                                <input 
                                    type="text" value={ui.msg} onChange={e => setUi(p => ({ ...p, msg: e.target.value }))}
                                    placeholder="채팅 입력..." 
                                    className="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white focus:ring-1 focus:ring-emerald-500 outline-none"
                                />
                                <button type="submit" disabled={!ui.msg.trim()} className="p-2 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white rounded-xl transition">
                                    <Icons.Send />
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
